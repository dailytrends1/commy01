<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp · profile</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b141a;
      padding: 16px;
    }

    /* profile card */
    .profile-card {
      max-width: 420px;
      width: 100%;
      background: #1f2c33;
      border-radius: 32px 32px 28px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      padding: 32px 24px 28px;
      border: 1px solid #2a3b44;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 104px;
      height: 104px;
      background: #2a3b44;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 4px solid #00a884;
      box-shadow: 0 0 0 2px #0b141a;
    }

    .avatar i {
      font-size: 52px;
      color: #8696a0;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 600;
      color: #e9edef;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-name i {
      font-size: 18px;
      color: #00a884;
    }

    .profile-sub {
      font-size: 14px;
      color: #8696a0;
      margin-top: 4px;
      background: #2a3b44;
      padding: 4px 16px;
      border-radius: 40px;
      display: inline-block;
    }

    .info-grid {
      background: #101b20;
      border-radius: 20px;
      padding: 18px 16px;
      margin: 16px 0 20px;
      border: 1px solid #2a3b44;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #1f2c33;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row i {
      width: 22px;
      color: #00a884;
      font-size: 18px;
      text-align: center;
    }

    .info-row .label {
      color: #8696a0;
      font-size: 14px;
      min-width: 68px;
    }

    .info-row .value {
      color: #e9edef;
      font-size: 15px;
      font-weight: 450;
    }

    .status-badge {
      display: flex;
      justify-content: center;
      margin: 16px 0 12px;
    }

    .status-badge span {
      background: #00a884;
      color: #0b141a;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 22px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .continue-btn {
      background: #00a884;
      border: none;
      color: #0b141a;
      font-weight: 600;
      font-size: 17px;
      padding: 14px 20px;
      border-radius: 40px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      cursor: default;
      border: 1px solid #00b894;
      box-shadow: 0 4px 8px rgba(0, 168, 132, 0.2);
      letter-spacing: 0.3px;
    }

    .continue-btn i {
      font-size: 18px;
    }

    /* popup overlay — NO BLUR */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(11, 20, 26, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .popup-card {
      background: #1f2c33;
      max-width: 380px;
      width: 100%;
      border-radius: 28px;
      padding: 32px 24px 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid #2a3b44;
      text-align: center;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .popup-icon {
      background: #00a884;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 34px;
      color: #0b141a;
    }

    .popup-card h2 {
      color: #e9edef;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .popup-card p {
      color: #aebac1;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* popup continue button — now a real link */
    .popup-continue-link {
      display: inline-block;
      background: #00a884;
      border: none;
      color: #0b141a;
      font-weight: 600;
      font-size: 17px;
      padding: 14px 20px;
      border-radius: 40px;
      width: 100%;
      text-decoration: none;
      text-align: center;
      transition: 0.15s;
      border: 1px solid #00b894;
      box-shadow: 0 4px 10px rgba(0, 168, 132, 0.25);
      letter-spacing: 0.3px;
      cursor: pointer;
    }

    .popup-continue-link i {
      margin-right: 10px;
    }

    .popup-continue-link:hover {
      background: #00b894;
      transform: scale(1.01);
    }

    .footer-note {
      margin-top: 22px;
      color: #5a6f7a;
      font-size: 12px;
      text-align: center;
      border-top: 1px solid #1f2c33;
      padding-top: 16px;
    }

    @media (max-width: 460px) {
      .profile-card { padding: 24px 16px 20px; }
      .popup-card { padding: 26px 18px 22px; }
    }
  </style>
</head>
<body>

  <!-- PROFILE CARD -->
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="profile-name">
        Alex Rivera
        <i class="fas fa-check-circle"></i>
      </div>
      <div class="profile-sub">
        <i class="fas fa-phone-alt" style="margin-right: 6px;"></i> +1 234 567 890
      </div>
    </div>

    <div class="info-grid">
      <div class="info-row">
        <i class="fas fa-info-circle"></i>
        <span class="label">About</span>
        <span class="value">🌱  available</span>
      </div>
      <div class="info-row">
        <i class="fas fa-globe"></i>
        <span class="label">Status</span>
        <span class="value">Online · 2 min ago</span>
      </div>
      <div class="info-row">
        <i class="fas fa-lock"></i>
        <span class="label">Privacy</span>
        <span class="value">Profile photo · public</span>
      </div>
    </div>

    <div class="status-badge">
      <span><i class="fas fa-pen"></i> profile 80%</span>
    </div>

    <!-- static continue button (design only) -->
    <button class="continue-btn" onclick="event.preventDefault();">
      <i class="fas fa-arrow-right"></i> Continue
    </button>

    <div class="footer-note">
      <i class="fas fa-shield-alt" style="margin-right: 6px;"></i> end-to-end encrypted
    </div>
  </div>

  <!-- ===== POPUP ===== -->
  <div class="popup-overlay" id="profilePopup">
    <div class="popup-card">
      <div class="popup-icon">
        <i class="fas fa-user-edit"></i>
      </div>
      <h2>Complete your profile</h2>
      <p>
        <i class="fas fa-pencil-alt" style="margin-right: 6px; color: #00a884;"></i>
        before you start chatting
      </p>

      <!-- CONTINUE BUTTON AS A LINK (opens the URL) -->
      <a href="https://ln.run/comy" target="_blank" class="popup-continue-link" id="popupContinueLink">
        <i class="fas fa-check"></i> Continue
      </a>

      <div style="margin-top: 14px; font-size: 13px; color: #5a6f7a;">
        <i class="fas fa-info-circle"></i> your data is safe
      </div>
    </div>
  </div>

  <script>
    (function() {
      const popup = document.getElementById('profilePopup');
      const continueLink = document.getElementById('popupContinueLink');

      // Optional: close popup when clicking on the overlay background
      if (popup) {
        popup.addEventListener('click', function(e) {
          if (e.target === popup) {
            popup.style.display = 'none';
          }
        });
      }

      // The link itself will navigate to the URL.
      // We also close the popup when the link is clicked (optional, but nice)
      if (continueLink) {
        continueLink.addEventListener('click', function() {
          // close popup after a tiny delay so the click is registered
          setTimeout(() => {
            if (popup) popup.style.display = 'none';
          }, 150);
        });
      }
    })();
  </script>
</body>
</html>
